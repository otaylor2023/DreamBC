project_root: .

sim:
  headless: false
  steps: 120
  warmup_steps: 20
  save_every: 10
  stage_units_in_meters: 1.0
  require_cameras: false
  keep_open_after_rollout: true

robot:
  gripper: robotiq
  target_path: /World/Panda
  articulation_child: Robot
  locked_base_joint_names: [base_prismatic_x, base_prismatic_y, base_revolute, base_prismatic_link0]
  initial_locked_base_joint_positions:
    base_prismatic_x: 0.0
    base_prismatic_y: 0.0
    base_revolute: -1.5708
    base_prismatic_link0: 0.0
  arm_joint_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
  initial_arm_joint_positions: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
  initial_gripper_position:
    franka: 0.04
    robotiq: 0.3949582
  control:
    enable_runtime_drive_tuning: true
    base_position_stiffness: [100000.0, 100000.0, 100000.0, 100000.0]
    base_position_damping: [5000.0, 5000.0, 5000.0, 5000.0]
    base_max_effort: [1000.0, 1000.0, 1000.0, 1000.0]
    arm_position_stiffness: [60000.0, 60000.0, 60000.0, 60000.0, 25000.0, 15000.0, 5000.0]
    arm_position_damping: [3000.0, 3000.0, 3000.0, 3000.0, 3000.0, 3000.0, 3000.0]
    arm_max_effort: [300.0, 300.0, 300.0, 300.0, 120.0, 120.0, 120.0]
    gripper_position_stiffness:
      franka: [6000.0, 6000.0]
      robotiq: [6000.0]
    gripper_position_damping:
      franka: [1000.0, 1000.0]
      robotiq: [1000.0]
    gripper_max_effort:
      franka: [200.0, 200.0]
      robotiq: [200.0]
  gripper_joint_names:
    franka: [finger_joint1, finger_joint2]
    robotiq: [finger_joint]
  urdfs:
    franka: urdf_models/mmp_panda/mmp_panda.urdf
    robotiq: urdf_models/mmp_panda/mmp_panda_robotiq85.urdf

scene:
  table:
    prim_path: /World/Table
    name: table
    position: [0.55, 0.0, 0.0]
    scale: [0.80, 0.55, 0.06]
    color: [0.45, 0.45, 0.42]
  test_cube:
    prim_path: /World/TestCube
    name: test_cube
    position: [0.55, 0.0, 0.1]
    scale: [0.05, 0.05, 0.05]
    color: [0.9, 0.12, 0.08]

# Camera layout follows DROID / pi05_droid *semantics* (not exact hardware extrinsics):
# - Exterior: fixed third-person, ~25–45° depression, robot + table + objects in frame (RLDS uses 320×180).
# - Wrist: rigidly attached to the gripper chain, viewing the grasp / workspace ahead of the tool.
cameras:
  exterior_image_1_left:
    prim_path: /World/Cameras/exterior_image_1_left
    # -Y side, pulled back and raised so the arm is not cropped out (narrow FOV close-ups hurt VLAs).
    position: [0.05, -1.58, 1.22]
    look_at: [0.55, 0.0, 0.20]
    frequency: 20
    resolution: [224, 224]
  exterior_image_2_left:
    prim_path: /World/Cameras/exterior_image_2_left
    # +Y side, complementary exterior (similar to DROID's second ZED station view).
    position: [0.05, 1.52, 1.16]
    look_at: [0.55, 0.0, 0.20]
    frequency: 20
    resolution: [224, 224]
  wrist_image_left:
    # Keep the manual mount as a fallback, then auto-align it against the actual jaw centerline
    # at runtime so embodiment geometry stays consistent across resets / gripper variants.
    prim_path: /World/Panda/Robot/robotiq_85_base_link/wrist_image_left
    translation: [-0.12, -0.08, -0.08]
    look_at: [0.118, -0.02, 0.188]
    auto_align:
      enabled: true
      anchor: inner_finger_center
      inherit_translation_offset_from_manual_mount: true
      inherit_look_at_offset_from_manual_mount: true
      # Zero the lateral jaw-plane offset so the optical ray passes through the grasp center plane.
      zero_translation_offset_axes: [y]
      zero_look_at_offset_axes: [y]
      translation_offset_adjustment: [0.0, 0.0, 0.0]
      look_at_offset_adjustment: [0.0, 0.0, 0.0]
    # Moderate wrist FOV: wide enough to keep fingertips in view, narrower than the debug fisheye-like setting.
    focal_length: 1.5
    # Keep the near plane close enough for wrist-mounted views of the gripper and table.
    clipping_range: [0.01, 100.0]
    frequency: 20
    resolution: [224, 224]
fake_policy:
  phase_scale: 0.045
  arm_offsets: [0.04, -0.03, 0.03, -0.04, 0.02, 0.015, -0.02]
  gripper_period_steps: 40
  gripper_open_target: 0.3949582
  gripper_closed_target: 0.1770090

policy:
  kind: fake
  pi05_droid_remote:
    host: localhost
    port: 8000
    prompt: pick up the red cube
    execute: false
    exterior_image_key: exterior_image_1_left
    wrist_image_key: wrist_image_left
    image_size: 224
    action_mode: joint_velocity_target
    action_hz: 15
    max_joint_velocity: 0.2
    binarize_gripper: true
    force_gripper_open_steps: 0
    gripper_open_target: 0.3949582
    gripper_closed_target: 0.1770090
    gripper_observation_open_position: 0.3949582
    gripper_observation_closed_position: 0.1770090

output:
  dir: rollouts/minimal_rollout
  timestamp_format: "%Y%m%d_%H%M%S"

debug:
  print_stage_tree: false
  stage_tree_root: /World/Panda/Robot
  stage_tree_max_depth: 3
  print_camera_poses: false
  print_prim_positions: false
  prim_position_paths:
    - /World/Panda/Robot/link7
    - /World/Panda/Robot/robotiq_85_base_link
    - /World/Panda/Robot/left_outer_finger
    - /World/Panda/Robot/right_outer_finger
    - /World/Panda/Robot/left_inner_finger
    - /World/Panda/Robot/right_inner_finger
    - /World/Panda/Robot/robotiq_85_base_link/wrist_image_left
    - /World/Table
    - /World/TestCube
  add_camera_markers: false
  grasp_debug:
    enabled: true
    cube_prim_path: /World/TestCube
    gripper_base_prim_path: /World/Panda/Robot/robotiq_85_base_link
    left_outer_finger_prim_path: /World/Panda/Robot/left_outer_finger
    right_outer_finger_prim_path: /World/Panda/Robot/right_outer_finger
    left_inner_finger_prim_path: /World/Panda/Robot/left_inner_finger
    right_inner_finger_prim_path: /World/Panda/Robot/right_inner_finger
    wrist_camera_prim_path: /World/Panda/Robot/robotiq_85_base_link/wrist_image_left

hydra:
  job:
    chdir: false
  run:
    dir: ${project_root}/outputs/hydra/${now:%Y%m%d_%H%M%S}
